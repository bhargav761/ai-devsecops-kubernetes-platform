upstream user_api {
    server user:9000;
}

upstream post_api {
    server post:9001;
}

upstream newsfeed_api {
    server newsfeed:9002;
}

upstream web_api {
    server web:3000;
}

map $http_connection $connection_upgrade {
    "~*Upgrade" $http_connection;
    default keep-alive;
}


# ============================================================
# HTTP → HTTPS
# Host port 8080 → container port 80
# Redirect to host HTTPS port 4430
# ============================================================
server {
    listen 80 default_server;
    server_name localhost;

    return 301 https://$host:4430$request_uri;
}


# ============================================================
# HTTPS
# Host port 4430 → container port 443
# ============================================================
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/localhost.crt;
    ssl_certificate_key /etc/ssl/private/localhost.key;


    # ========================================================
    # React Frontend
    # https://localhost:4430/
    # ========================================================
    location / {
        proxy_pass http://web_api;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # React development server / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cache_bypass $http_upgrade;
    }


    # ========================================================
    # User API
    #
    # /user-api/v1/Accounts
    #          ↓
    # /api/v1/Accounts
    # ========================================================
    location /user-api/ {
        proxy_pass http://user_api/api/;

        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }


    # ========================================================
    # Post API
    #
    # /post-api/v1/UserPosts
    #          ↓
    # /api/v1/UserPosts
    # ========================================================
    location /post-api/ {
        proxy_pass http://post_api/api/;

        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }


    # ========================================================
    # Newsfeed API
    #
    # /newsfeed-api/v1/Newsfeeds/{userId}
    #              ↓
    # /api/v1/Newsfeeds/{userId}
    # ========================================================
    location /newsfeed-api/v1/ {
        proxy_pass http://newsfeed_api/api/v1/;

        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }


    # ========================================================
    # SignalR Newsfeed Hub
    # ========================================================
    location /hubs/newsfeed {
        proxy_pass http://newsfeed_api/hubs/newsfeed;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 100s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # Aggregated User Profile
    # ========================================================
    location /api/v1/user-profile/ {
        content_by_lua_file /etc/nginx/conf.d/lua/agg.lua;
    }
}